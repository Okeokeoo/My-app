<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><title>Breukenkampioen</title><style>*{box-sizing:border-box}body{font:17px system-ui;background:#f0f5fc;color:#19304a;margin:0}main{max-width:560px;margin:auto;padding:22px}h1{font-size:30px;margin:10px 0}article{background:white;border-radius:22px;padding:22px;margin:18px 0;box-shadow:0 4px 20px #19304a0b}button,select{font:inherit;border:0;border-radius:12px;padding:14px;background:#e8effa;color:#19304a;cursor:pointer}select{width:100%}button{font-weight:650}#answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}button.good{background:#c4f0d7}button.bad{background:#fdd9d9}#next{background:#315fc5;color:white;width:100%;margin-top:16px}#question{font-size:23px;font-weight:700;text-align:center;white-space:pre-line}#picture{width:160px;margin:16px auto}#picture svg{width:100%}#feedback{line-height:1.5}small{color:#52647a}.stats{display:flex;justify-content:space-between;font-weight:700}progress{width:100%;accent-color:#315fc5}#reward{text-align:center;background:#fff5da;border-radius:18px;padding:20px;margin-top:14px}#animal{font-size:92px;animation:pop .5s ease-out}#collection{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}#collection div{background:#f0f5fc;border-radius:12px;padding:8px 2px;font-size:12px}#collection span{display:block;font-size:36px}@keyframes pop{from{transform:scale(.2) rotate(-15deg)}to{transform:scale(1)}}#streak{margin-top:12px;color:#315fc5;font-weight:bold}</style><main><small>REKENACADEMIE · GROEP 6–8</small><h1>🏆 Breukenkampioen</h1><p>Oefen, ontdek en word steeds beter!</p><article><div class="stats"><span id="score"></span><span id="level"></span></div><progress id="progress" max="10"></progress><small id="accuracy"></small><div id="streak"></div></article><label for="topic">Wat wil je oefenen?</label><select id="topic"><option>Breuken herkennen</option><option>Gelijkwaardige breuken</option><option>Vereenvoudigen</option><option>Vergelijken</option><option>Optellen en aftrekken</option><option>Vermenigvuldigen en delen</option><option>Procenten en kommagetallen</option><option>Alles door elkaar</option></select><article><div id="question"></div><div id="picture"></div><div id="answers"></div><p id="feedback" aria-live="polite"></p><section id="reward" hidden aria-live="polite"><h2>🎉 Vijf op een rij!</h2><div id="animal"></div><strong id="animalname"></strong></section><button id="next" hidden>Volgende vraag →</button></article><article><h2>Mijn dierentuin</h2><p id="colcount"></p><div id="collection"></div></article><button id="reset">Voortgang wissen</button><p><small>Je voortgang wordt alleen op dit apparaat bewaard.</small></p></main><script>
const $=id=>document.getElementById(id),r=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),g=(a,b)=>b?g(b,a%b):Math.abs(a),f=(a,b)=>{let d=g(a,b);return b/d===1?String(a/d):`${a/d}/${b/d}`};let s={right:0,total:0};try{s=JSON.parse(localStorage.getItem('breuk-score'))||s}catch{};const animals=[['🐼','Panda'],['🦊','Vos'],['🐨','Koala'],['🐹','Hamster'],['🐰','Konijn'],['🦦','Otter'],['🐧','Pinguïn'],['🦔','Egel'],['🐿️','Eekhoorn'],['🐭','Muis'],['🐱','Kat'],['🐶','Hond'],['🦁','Leeuw'],['🐯','Tijger'],['🐸','Kikker'],['🐥','Kuiken'],['🦉','Uil'],['🦋','Vlinder'],['🐢','Schildpad'],['🦄','Eenhoorn'],['🦙','Lama'],['🦥','Luiaard'],['🐘','Olifant'],['🦒','Giraf'],['🐬','Dolfijn'],['🐙','Octopus'],['🦭','Zeehond'],['🦝','Wasbeer'],['🐀','Rat'],['🐴','Pony'],['🐻','Beer'],['🐵','Aap']];s.streak=s.streak||0;s.animals=Array.isArray(s.animals)?s.animals:[];function reward(){let pool=animals.map((_,i)=>i).filter(i=>!s.animals.includes(i));if(!pool.length)pool=animals.map((_,i)=>i).filter(i=>i!==s.lastAnimal);let i=pool[r(0,pool.length-1)];s.lastAnimal=i;if(!s.animals.includes(i))s.animals.push(i);$('animal').textContent=animals[i][0];$('animalname').textContent='Je hebt een '+animals[i][1].toLowerCase()+' verdiend!';$('reward').hidden=false;}function stats(){let count=s.streak||0;$('streak').textContent='Op weg naar een diertje: '+ '⭐'.repeat(count)+'☆'.repeat(5-count)+' '+count+'/5';let owned=s.animals||[];$('colcount').textContent=owned.length+' van '+animals.length+' dieren verzameld';$('collection').innerHTML=animals.map(([emoji,name],i)=>owned.includes(i)?`<div><span>${emoji}</span>${name}</div>`:'<div><span>❔</span>Verrassing</div>').join('');$('score').textContent='⭐ '+s.right*10+' punten';$('level').textContent='Level '+(1+Math.floor(s.right/10));$('progress').value=s.right%10;$('accuracy').textContent=s.total?Math.round(100*s.right/s.total)+'% goed · '+s.total+' vragen':'Nog geen vragen beantwoord';try{localStorage.setItem('breuk-score',JSON.stringify(s))}catch{}}function question(){$('reward').hidden=true;let t=$('topic').selectedIndex;if(t===7)t=r(0,6);let b=r(2,10),a=r(1,b-1),c=r(1,b-1),d=r(2,8),k=r(2,5),q,ans,opts,ex; $('picture').innerHTML='';if(t===0){q='Welk deel is blauw?';ans=`${a}/${b}`;opts=Array.from({length:b+1},(_,i)=>`${i}/${b}`);while(opts.length<4)opts.push('1/'+(b+opts.length));ex=`Er zijn ${b} gelijke stukken, waarvan ${a} blauw. Dus ${ans}.`;let p='';for(let i=0;i<b;i++){let x=j=>80+72*Math.cos(2*Math.PI*j/b-Math.PI/2),y=j=>80+72*Math.sin(2*Math.PI*j/b-Math.PI/2);p+=`<path d="M80 80 L${x(i)} ${y(i)} A72 72 0 0 1 ${x(i+1)} ${y(i+1)} Z" fill="${i<a?'#4476df':'#e0e8f3'}" stroke="white" stroke-width="2"/>`}$('picture').innerHTML=`<svg viewBox="0 0 160 160" role="img" aria-label="Verdeelde cirkel">${p}</svg>`}else if(t===1){q=`Welke breuk is gelijk aan ${a}/${b}?`;ans=`${a*k}/${b*k}`;opts=[`${a*k+1}/${b*k}`,`${a*k}/${b*k+1}`,`${a*k+2}/${b*k}`];ex=`Vermenigvuldig teller en noemer allebei met ${k}.`}else if(t===2){q=`Vereenvoudig ${a*k}/${b*k} zo ver mogelijk.`;ans=f(a,b);opts=[`${a*k}/${b*k}`,`${a*k+1}/${b*k}`,`${a*k}/${b*k+1}`];ex=`Deel teller en noemer door ${g(a*k,b*k)}. Dan krijg je ${ans}.`}else if(t===3){q=`Welk teken hoort ertussen?\n${a}/${b}  …  ${c}/${d}`;ans=a*d>c*b?'>':a*d<c*b?'<':'=';opts=['<','>','='];ex=`Maak de noemers gelijk: ${a*d}/${b*d} en ${c*b}/${b*d}. Het juiste teken is ${ans}.`}else if(t===4||t===5){let op=t===4?(r(0,1)?'+':'−'):(r(0,1)?'×':'÷');if(op==='−'&&a*d<c*b){[a,c]=[c,a];[b,d]=[d,b]}let n=op==='+'?a*d+c*b:op==='−'?a*d-c*b:op==='×'?a*c:a*d,m=op==='÷'?b*c:b*d;q=`${a}/${b} ${op} ${c}/${d} = ?`;ans=f(n,m);opts=[f(n+1,m),f(n+2,m),f(n+3,m)];ex=t===4?`Maak de noemers gelijk: ${a*d}/${m} en ${c*b}/${m}. Reken dan uit en vereenvoudig tot ${ans}.`:op==='×'?`Vermenigvuldig de tellers en de noemers: ${n}/${m} = ${ans}.`:`Keer de tweede breuk om en vermenigvuldig: ${n}/${m} = ${ans}.`}else{let v=[10,20,25,40,50,60,75,80,90][r(0,8)],dec=r(0,1);q=`Hoeveel ${dec?'als kommagetal':'procent'} is ${f(v,100)}?`;let fmt=x=>dec?String(x/100).replace('.',','):x+'%';ans=fmt(v);opts=[fmt(v+5),fmt(v-5),fmt(v+10)];ex=`${f(v,100)} = ${v}/100 = ${fmt(v)}.`}let choices=[...new Set(opts.filter(x=>x!==ans))].sort(()=>Math.random()-.5).slice(0,t===3?2:3);choices.push(ans);for(let i=choices.length-1;i>0;i--){let j=r(0,i);[choices[i],choices[j]]=[choices[j],choices[i]]}$('question').textContent=q;$('feedback').textContent='';$('next').hidden=true;$('answers').replaceChildren();for(let x of choices){let btn=document.createElement('button');btn.textContent=x;btn.onclick=()=>{s.total++;if(x===ans){s.right++;s.streak=(s.streak||0)+1;if(s.streak===5){s.streak=0;reward()}}else{s.streak=0}stats();for(let el of $('answers').children){el.disabled=true;if(el.textContent===ans)el.classList.add('good')}if(x!==ans)btn.classList.add('bad');$('feedback').textContent=(x===ans?'Goed gedaan! 🎉 ':'Bijna! Het juiste antwoord is '+ans+'. ')+ex;$('next').hidden=false};$('answers').append(btn)}}$('next').onclick=question;$('topic').onchange=question;$('reset').onclick=()=>{if(confirm('Wil je alle punten en voortgang wissen?')){s={right:0,total:0,streak:0,animals:[]};stats();question()}};stats();question();</script></html>
